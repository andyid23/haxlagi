content: "\n<h1 id=\"h1-1860569192\">📝 Todo List &#8212; Daftar Tugas</h1>\n<p>Elemen <code>&lt;todo-list&gt;</code> adalah komponen daftar tugas sederhana yang\n  menggunakan DDD Design System dari HAX. Mendukung fitur CRUD lengkap dengan editor\n  bawaan.</p>\n<h2 id=\"h2-1591783538\">🧪 Demo Langsung</h2>\n<p>Coba todo list interaktif di bawah ini:</p>\n<todo-list editable tasks=\"[{&quot;id&quot;:&quot;0911b962-0cbb-4712-aa32-a2c917b2fac0&quot;,&quot;text&quot;:&quot;lllkj&quot;,&quot;completed&quot;:false},{&quot;id&quot;:&quot;5d443879-dfd7-4c70-a491-2f6588aa4d12&quot;,&quot;text&quot;:&quot;jlkl&quot;,&quot;completed&quot;:false},{&quot;id&quot;:&quot;69e54711-5c3f-4aa2-bb38-db2cda19b397&quot;,&quot;text&quot;:&quot;kljlk&quot;,&quot;completed&quot;:false},{&quot;id&quot;:&quot;42750e12-cb5f-42cd-b07d-743baf359606&quot;,&quot;text&quot;:&quot;daftar 1&quot;,&quot;completed&quot;:false}]\" _screen=\"list\" _temp-tasks=\"[{&quot;id&quot;:&quot;0911b962-0cbb-4712-aa32-a2c917b2fac0&quot;,&quot;text&quot;:&quot;lllkj&quot;,&quot;completed&quot;:false},{&quot;id&quot;:&quot;5d443879-dfd7-4c70-a491-2f6588aa4d12&quot;,&quot;text&quot;:&quot;jlkl&quot;,&quot;completed&quot;:false},{&quot;id&quot;:&quot;69e54711-5c3f-4aa2-bb38-db2cda19b397&quot;,&quot;text&quot;:&quot;kljlk&quot;,&quot;completed&quot;:false},{&quot;id&quot;:&quot;42750e12-cb5f-42cd-b07d-743baf359606&quot;,&quot;text&quot;:&quot;daftar 1&quot;,&quot;completed&quot;:false}]\" _editing-index=\"-1\" _editor-origin=\"list\"></todo-list>\n<h2 id=\"h2-1518686653\">📋 Atribut yang Didukung</h2>\n<editable-table accent-color=\"grey\" column-header><table>\n\t<thead class=\"thead\">\n\t\t<tr class=\"thead-tr tr\">\n\t\t\t<th scope=\"col\" class=\"th th-or-td\">-</th>\n\t\t\t<th scope=\"col\" class=\"th th-or-td\">-</th>\n\t\t</tr>\n\n\t</thead>\n\n\t<tbody class=\"tbody\">\n\t\t<tr class=\"tbody-tr tr\">\n\t\t\t<td class=\"td th-or-td\">-</td>\n\t\t\t<td class=\"td th-or-td\">-</td>\n\t\t</tr>\n\n\t</tbody>\n\n</table>\n</editable-table>\n<h2 id=\"h2-725032406\">🖥️ Cara Penggunaan</h2>\n<h3 id=\"h3--2047907327\">Tag Dasar</h3>\n<pre><code>&lt;todo-list&gt;&lt;/todo-list&gt;</code></pre>\n<h3 id=\"h3-777087102\">Dengan Data Awal</h3>\n<pre><code>&lt;todo-list tasks='[{\"id\":\"1\",\"text\":\"Belajar HAXcms\",\"completed\":false},{\"id\":\"2\",\"text\":\"Buat komponen kustom\",\"completed\":true}]'&gt;&lt;/todo-list&gt;</code></pre>\n<h3 id=\"h3--1601356409\">Menggunakan JavaScript</h3>\n<pre><code>const todoList = document.querySelector('todo-list');\ntodoList.tasks = [\n  { id: '1', text: 'Belajar Lit Element', completed: false },\n  { id: '2', text: 'Buat Web Component', completed: true }\n];</code></pre>\n<h2 id=\"h2--19471014\">🛠️ Fitur</h2>\n<ul>\n    <li><strong>Tambah Tugas:</strong> Input teks + tombol Add, atau tekan Enter</li>\n\n\n    <li><strong>Checklist:</strong> Tandai tugas selesai/belum</li>\n\n\n    <li><strong>Hapus Tugas:</strong> Tombol delete pada setiap item</li>\n\n\n    <li><strong>Validasi Input:</strong> Minimal 3 karakter, maksimal 50 karakter</li>\n\n\n    <li><strong>Editor Bawaan:</strong> Panel editor untuk mengelola daftar tugas (mode HAX\n      editor)</li>\n\n\n    <li><strong>Empty State:</strong> Tampilan saat belum ada tugas</li>\n\n\n    <li><strong>DDD Design System:</strong> Menggunakan token desain HAX (warna, spacing,\n      font)</li>\n\n\n    <li><strong>Aksesibilitas:</strong> aria-label lengkap, keyboard navigation</li>\n\n\n  </ul>\n<h2 id=\"h2-721169473\">🎨 Tema Polaris</h2>\n<p>Komponen ini menggunakan tema <strong>Polaris</strong> dengan palet ungu:</p>\n<ul>\n    <li>Background: putih dengan shadow</li>\n    <li>Border kiri ungu pada setiap item tugas</li>\n    <li>Tombol Delete: outline merah, fill merah saat hover</li>\n    <li>Teks tugas selesai: dicoret dengan opacity 50%</li>\n  </ul>\n<h2 id=\"h2--1131647999\">📦 Struktur Data Tugas</h2>\n<pre><code>{\n  \"id\": \"string (UUID atau timestamp)\",\n  \"text\": \"string (teks tugas, 3-50 karakter)\",\n  \"completed\": boolean\n}</code></pre>\n<h2 id=\"h2--291047800\">🧩 Integrasi dengan HAX Editor</h2>\n<p>Saat digunakan di dalam HAXcms editor, komponen ini otomatis menampilkan tombol <strong>\"Edit Task List\"</strong> yang\n    membuka panel editor untuk mengelola daftar tugas secara visual.</p>\n"
