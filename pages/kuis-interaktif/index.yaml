content: "\n<h1 id=\"h1--1446091668\">🎯 Explode Quiz &#8212; Kuis Interaktif</h1>\n<p>Elemen <code>&lt;explode-quiz&gt;</code> adalah komponen kuis interaktif pilihan ganda\n  yang dilengkapi efek konfeti, editor soal bawaan, dan integrasi Google Sheets untuk\n  menyimpan hasil kuis secara real-time.</p>\n<h2 id=\"h2-1591783538\">🧪 Demo Langsung</h2>\n<div>\n   <h2><span class=\"step-num\">1</span> Login / Registrasi</h2>\n\n\n  <quiz-user-auth id=\"auth\" apps-script-url=\"https://script.google.com/macros/s/AKfycbzH1CHRwz0RJ7_oblUfzW7b_C90808aIGQ9kSdFimXW0_QiWjUWdlbKdPcxY25P0xyY/exec\" _screen=\"check\" _nama=\"Andy Yulianto\" _email=\"wildanhabib051@gmail.com\" _nis=\"234\" _absen=\"2\" _kelas=\"XI-1\" _student-id=\"STD-65108053\" _loading></quiz-user-auth>\n\n</div>\n<p>Coba kuis interaktif di bawah ini:</p>\n<explode-quiz s=\"\" sheet-name=\"Pertemuan\" quiz-category=\"formatif\" apps-script-url=\"https://script.google.com/macros/s/AKfycby3-aTxHA7GIFZd9r8EJsPk7MLsDb-Yij4zT_2x8iMJc5EIqDrypw4yU-xTFo6A8WZL/exec\" shuffle-choices _current-index=\"0\" _selected-index=\"-1\" _temp-questions=\"[]\" _editing-index=\"-1\" _temp-correct-index=\"0\" _editor-origin=\"result\" _temp-question-type=\"mc\" _temp-correct-answers=\"[]\" _temp-left-items=\"[&quot;&quot;,&quot;&quot;]\" _temp-right-items=\"[&quot;&quot;,&quot;&quot;]\" _temp-correct-pairs=\"{}\" _temp-accepted-statements=\"[]\" _shuffled-questions=\"[]\" _selected-answers=\"{}\" _match-answers=\"{}\" _temp-question-points=\"1\" _max-points=\"0\" spreadsheet-id=\"\" script-function-name=\"submitQuizResult\" student-name=\"Andy Yulianto\" student-id=\"STD-65108053\" student-nis=\"234\" student-absen=\"2\" student-kelas=\"XI-1\" _student-name=\"Andy Yulianto\" _validation-error=\"Nama tidak boleh kosong.\" data-width=\"0\" data-padding=\"xs\" data-margin=\"center\" _feedback-text=\"Yah, Salah. Jawaban benar: Bumi\" _name-input-value=\"dsfdsfd\" _advance-timer=\"15652\" tag=\"formatif\" questions=\"[{&quot;question&quot;:&quot;Apa ibu kota Indonesia?&quot;,&quot;choices&quot;:[&quot;Bandung&quot;,&quot;Surabaya&quot;,&quot;Jakarta&quot;,&quot;Medan&quot;],&quot;correctIndex&quot;:2},{&quot;question&quot;:&quot;Berapa hasil dari 7 × 8?&quot;,&quot;choices&quot;:[&quot;54&quot;,&quot;56&quot;,&quot;58&quot;,&quot;60&quot;],&quot;correctIndex&quot;:1},{&quot;question&quot;:&quot;Planet terdekat dengan Matahari adalah?&quot;,&quot;choices&quot;:[&quot;Venus&quot;,&quot;Bumi&quot;,&quot;Mars&quot;,&quot;Merkurius&quot;],&quot;correctIndex&quot;:3}]\"></explode-quiz>\n<h2 id=\"h2-1518686653\">📋 Atribut yang Didukung</h2>\n<editable-table accent-color=\"grey\" column-header><table>\n\t<thead class=\"thead\">\n\t\t<tr class=\"thead-tr tr\">\n\t\t\t<th scope=\"col\" class=\"th th-or-td\">-</th>\n\t\t\t<th scope=\"col\" class=\"th th-or-td\">-</th>\n\t\t</tr>\n\n\t</thead>\n\n\t<tbody class=\"tbody\">\n\t\t<tr class=\"tbody-tr tr\">\n\t\t\t<td class=\"td th-or-td\">-</td>\n\t\t\t<td class=\"td th-or-td\">-</td>\n\t\t</tr>\n\n\t</tbody>\n\n</table>\n</editable-table>\n<h2 id=\"h2-725032406\">🖥️ Cara Penggunaan</h2>\n<h3 id=\"h3--2047907327\">Tag Dasar</h3>\n<pre><code>&lt;explode-quiz&gt;&lt;/explode-quiz&gt;</code></pre>\n<p>Menggunakan 3 soal default tentang pengetahuan umum.</p>\n<h3 id=\"h3--190931422\">Dengan Google Sheets</h3>\n<pre><code>&lt;explode-quiz spreadsheet-id=\"YOUR_SHEET_ID\" editable=\"true\"&gt;&lt;/explode-quiz&gt;</code></pre>\n<h3 id=\"h3-940637082\">Dengan Google Apps Script URL</h3>\n<pre><code>&lt;explode-quiz apps-script-url=\"https://script.google.com/macros/s/.../exec\"&gt;&lt;/explode-quiz&gt;</code></pre>\n<h2 id=\"h2--19471014\">🛠️ Fitur</h2>\n<ul>\n      <li><strong>3 Layar:</strong> Input Nama &#8594; Soal Kuis &#8594; Hasil</li>\n\n      <li><strong>Efek Konfeti:</strong> Animasi saat jawaban benar dan skor &#8805; 80%</li>\n\n      <li><strong>Editor Soal:</strong> Tambah, edit, hapus soal (dengan mode editable)</li>\n\n      <li><strong>Sinkronisasi Google Sheets:</strong> Hasil otomatis tersimpan</li>\n\n      <li><strong>Aksesibilitas:</strong> aria-label lengkap, keyboard navigation</li>\n\n      <li><strong>Responsif:</strong> Layout adaptif untuk mobile</li>\n\n    </ul>\n<h2 id=\"h2-1426947008\">📊 Format Data di Google Sheets</h2>\n<table>\n      <thead>\n        <tr>\n          <th>Kolom A</th>\n          <th>Kolom B</th>\n          <th>Kolom C</th>\n        </tr>\n\n      </thead>\n\n      <tbody>\n        <tr>\n          <td>Timestamp</td>\n          <td>Nama Siswa</td>\n          <td>Skor (%)</td>\n        </tr>\n\n      </tbody>\n\n    </table>\n<h2 id=\"h2-762896087\">🎨 Kustomisasi Soal</h2>\n<p>Klik tombol <strong>\"Edit Soal Kuis\"</strong> di layar hasil (jika <code>editable=\"true\"</code>)\n      untuk membuka panel editor. Anda dapat:</p>\n<ol>\n      <li>Menambah soal baru dengan 4 pilihan jawaban</li>\n      <li>Mengedit soal yang sudah ada</li>\n      <li>Menghapus soal (minimal 3 soal)</li>\n      <li>Menyimpan perubahan</li>\n    </ol>\n"
