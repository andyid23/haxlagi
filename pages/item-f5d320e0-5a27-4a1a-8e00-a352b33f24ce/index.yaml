  <section class="card">
    <h2>📖 Materi Pembelajaran</h2>
    <p>Pada pertemuan ini, kita akan mempelajari konsep literasi digital lanjutan, termasuk:</p>
    <ul>
      <li><strong>Evaluasi Sumber Informasi:</strong> Cara menilai kredibilitas sumber di internet</li>
      <li><strong>Ethics Digital:</strong> Etika dalam menggunakan teknologi dan media sosial</li>
      <li><strong>Keamanan Data:</strong> Perlindungan data pribadi dan privasi online</li>
      <li><strong>Digital Footprint:</strong> Jejak digital dan dampaknya terhadap kehidupan</li>
    </ul>
    <h3>Konsep Dasar</h3>
    <table>
      <thead>
        <tr><th>Konsep</th><th>Deskripsi</th></tr>
      </thead>
      <tbody>
        <tr><td><strong>Literasi Informasi</strong></td><td>Kemampuan menemukan, mengevaluasi, dan menggunakan informasi</td></tr>
        <tr><td><strong>Literasi Media</strong></td><td>Kemampuan memahami dan menganalisis pesan media</td></tr>
        <tr><td><strong>Literasi Teknologi</strong></td><td>Kemampuan menggunakan teknologi secara efektif dan bertanggung jawab</td></tr>
      </tbody>
    </table>
  </section>

