  <h2 id="h2-0"><br></h2>

  <h2 id="h2--182008647">Pendahuluan</h2>

  <p>Di era digital saat ini, kita hidup di tengah banjir informasi di mana data
  sangat
    mudah diakses namun sering kali sulit untuk divalidasi. <strong>Data</strong> adalah
    bahan mentah atau fakta nyata yang dapat dikumpulkan, sementara <strong>informasi</strong> adalah
    data yang telah diolah sehingga memiliki konteks atau arti. Membangun nalar kritis
    sangat penting agar kita tidak menjadi sasaran empuk disinformasi yang dapat berdampak
    buruk pada kehidupan pribadi maupun sosial. Contoh konkretnya adalah ketika seseorang
    menerima klaim kesehatan di media sosial yang ternyata tidak akurat; tanpa nalar
    kritis, keputusan medis yang salah bisa diambil dan membahayakan kesehatan.</p>
  <p>&#160;.</p>

  <learning-component subtitle="Membangun" type="" icon="av:airplay"
  accent-color="green" title="Nalar KRITIS"><p>Tujuan Pembelajaran (XI-LD-02):
  </p><ol><li>mengevaluasi kebenaran konten dengan menggunakan verifikasi teks,
  gambar, dan video, </li><li>menggunakan cara membaca lateral untuk
  mengevaluasi informasi digital yang kompleks</li></ol>

  <p></p></learning-component>

  <h2 id="h2-288799413">📖 Materi Pembelajaran</h2>

  <p>Pada pertemuan ini, kita akan mempelajari konsep literasi digital lanjutan,
  termasuk:</p>

  <ul><li><strong>Evaluasi Sumber Informasi:</strong> Cara menilai kredibilitas
  sumber di internet</li>


  <li><strong>Ethics Digital:</strong> Etika dalam menggunakan teknologi dan
  media sosial</li>


  <li><strong>Keamanan Data:</strong> Perlindungan data pribadi dan privasi
  online</li>


  <li><strong>Digital Footprint:</strong> Jejak digital dan dampaknya terhadap
  kehidupan</li>


  </ul>

  <h3>Konsep Dasar</h3>

  <table><thead><tr><th>Konsep</th><th>Deskripsi</th></tr>


  </thead>


    <tbody><tr><td><strong>Literasi Informasi</strong></td>

  <td>Kemampuan menemukan, mengevaluasi, dan menggunakan informasi</td></tr>


  <tr><td><strong>Literasi Media</strong></td>


  <td>Kemampuan memahami dan menganalisis pesan media</td></tr>


  <tr><td><strong>Literasi Teknologi</strong></td>


  <td>Kemampuan menggunakan teknologi secara efektif dan bertanggung</td></tr>


  </tbody>


  </table>

  <h3 id="h3-201844256">1. Fenomena Infodemi dan Ekosistem Periksa Fakta</h3>

  <p>Dunia saat ini menghadapi tantangan besar bernama
  <strong>infodemi</strong>, yaitu
    ledakan informasi yang berlebih, termasuk informasi palsu (hoaks) yang menyebar sangat
    cepat. Untuk menghadapi ini, telah terbentuk sebuah <strong>ekosistem periksa fakta</strong> yang
    melibatkan berbagai komponen untuk memverifikasi kebenaran informasi. Komponen utama
    dalam ekosistem ini meliputi organisasi periksa fakta resmi (seperti CekFakta.com
    atau Turnbackhoax.id), jurnalis profesional, teknologi kecerdasan buatan (AI) untuk
    mendeteksi berita palsu, hingga peran aktif publik dalam menyaring informasi sebelum
    membagikannya.</p>
  <h3 id="h3--631169077">2. Evaluasi Kredibilitas dengan Metode CRAAP</h3>

  <p>Salah satu cara paling efektif untuk menguji apakah sebuah sumber data
  layak dipercaya
    adalah dengan menggunakan metode <strong>CRAAP</strong>. Metode ini merupakan daftar
    centang evaluasi yang mencakup lima kriteria utama:</p>
  <ul>
    <li><strong>Currency (Kebaruan):</strong> Memeriksa apakah informasi tersebut masih mutakhir
      atau sudah kadaluwarsa.</li>


    <li><strong>Relevance (Relevansi):</strong> Menilai tingkat kepentingan informasi tersebut
      bagi kebutuhan riset atau tugas kita.</li>


    <li><strong>Authority (Otoritas):</strong> Mengidentifikasi penulis, penerbit, atau organisasi
      di balik informasi tersebut untuk memastikan keahlian mereka di bidangnya.</li>


    <li><strong>Accuracy (Akurasi):</strong> Memastikan kebenaran isi informasi dengan mencari
      bukti pendukung yang logis.</li>


    <li><strong>Purpose (Tujuan):</strong> Menganalisis motif di balik pembuatan informasi,
      apakah untuk mendidik secara objektif atau justru memiliki bias tertentu.</li>


  </ul>

  <h3 id="h3-412046609">3. Strategi Membaca Lateral dan Verifikasi Silang</h3>

  <p>Teknik <strong>membaca lateral</strong> adalah strategi di mana pembaca
  tidak hanya
    terpaku pada satu situs web yang sedang dibaca (membaca vertikal), melainkan "keluar"
    dari situs tersebut untuk mencari informasi rujukan lain di tab atau sumber berbeda.
    Tujuannya adalah untuk memverifikasi klaim dengan melihat apa yang dikatakan oleh
    sumber otoritas lain tentang informasi tersebut. Proses ini berkaitan erat dengan <strong>verifikasi silang</strong>,
    misalnya membandingkan klaim medis dari kiriman viral di platform X dengan data resmi
    dari lembaga terpercaya seperti Kementerian Kesehatan atau WHO.</p>
  <h2 id="h2-1385500399">Miskonsepsi Umum</h2>

  <ul>
    <li><strong>Miskonsepsi:</strong> "Informasi yang muncul di urutan pertama pada hasil
      pencarian Google pasti merupakan informasi yang paling benar dan valid."</li>


    <li><strong>Fakta:</strong> Urutan pencarian ditentukan oleh algoritma mesin pencari
      yang mempertimbangkan relevansi kata kunci dan popularitas (SEO), bukan kebenaran
      mutlak. Evaluasi kritis tetap diperlukan terhadap hasil yang muncul.</li>


    <li><strong>Miskonsepsi:</strong> "Jika sebuah artikel menggunakan bahasa yang terlihat
      ilmiah dan menyertakan banyak angka, maka data di dalamnya pasti valid."</li>


    <li><strong>Fakta:</strong> Banyak informasi palsu atau hoaks yang sengaja menggunakan
      istilah teknis atau angka-angka yang meyakinkan untuk mengelabui pembaca. Validitas
      sesungguhnya ditentukan oleh kredibilitas sumber asli dan hasil verifikasi silang
      dengan data otoritas.</li>


  </ul>

  <h2 id="h2-1963631746">Ringkasan Materi</h2>

  <ul>
    <li><strong>Data</strong> adalah fakta mentah, sedangkan <strong>informasi</strong> adalah
      data yang sudah bermakna.</li>


    <li><strong>Infodemi</strong> merupakan tantangan besar berupa persebaran hoaks massal
      di era digital.</li>


    <li><strong>Ekosistem periksa fakta</strong> terdiri dari organisasi resmi, jurnalis,
      AI, dan publik yang bekerja sama memvalidasi informasi.</li>


    <li><strong>Metode CRAAP</strong> (Currency, Relevance, Authority, Accuracy, Purpose)
      digunakan sebagai alat uji kredibilitas sumber.</li>


    <li><strong>Membaca lateral</strong> adalah teknik verifikasi dengan mencari referensi
      dari luar situs sumber asli.</li>


  </ul>

