  <h1 id="h1-739001227">📚 Membangun Nalar Kritis &#38; Validasi</h1>

  <h2 id="h2-0"><br></h2>

  <section class="card">
     <h2>🔐 Login</h2>

    <quiz-user-auth apps-script-url="https://script.google.com/macros/s/AKfycbxrgnsoaSl9Fb9q-1fRMVkGrvm9CC6SQBjN8pcwb4vDXxubAZu455cWCVOST-2UA6NX/exec" auto-login></quiz-user-auth>


